apiVersion: v1
kind: PersistentVolume
metadata:
  name: cloudsync-pv

spec:
  capacity: 
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  storageClassName: "standard"    # default for azure   standard for gcp/aws
  hostPath:
    path: /data/db

---


