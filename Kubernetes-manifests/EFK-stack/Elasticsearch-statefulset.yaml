apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch

spec:
  serviceName: elasticsearch
  replicas: 1

  selector:
    matchLabels:
      app: backend-elasticsearch

  template:
    metadata:
      labels:
        app: backend-elasticsearch

    spec:
      securityContext:
        fsGroup: 1000

      initContainers:
        - name: fix-permissions
          image: busybox

          command:
            - sh
            - -c
            - chown -R 1000:1000 /usr/share/elasticsearch/data

          volumeMounts:
            - name: elasticsearch-storage
              mountPath: /usr/share/elasticsearch/data

      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0

          ports:
            - containerPort: 9200
              name: http

            - containerPort: 9300
              name: transport

          env:
            - name: discovery.type
              value: single-node

            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

            - name: xpack.security.enabled
              value: "false"

            - name: xpack.security.enrollment.enabled
              value: "false"

            - name: cluster.name
              value: docker-cluster

          volumeMounts:
            - name: elasticsearch-storage
              mountPath: /usr/share/elasticsearch/data

      volumes:
        - name: elasticsearch-storage
          persistentVolumeClaim:
            claimName: cloudsync-pvc3
