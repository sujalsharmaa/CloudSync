apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudsync-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  volumeName: cloudsync-pv-postgres
  resources:
    requests:
      storage: 5Gi

